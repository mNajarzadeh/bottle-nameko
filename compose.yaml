services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: dev
      RABBITMQ_DEFAULT_PASS: dev
  greeting:
    build:
      context: ./examples
    depends_on:
      - rabbitmq

  gateway:
    build:
      context: ./examples
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    environment:
      PYTHONPATH: /workspace
    ports:
      - "127.0.0.1:8080:8080"
    command:
      - python
      - -m
      - bottle_nameko.cli
      - examples.simple_gateway:app
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
    depends_on:
      - rabbitmq
      - greeting

  tests:
    build:
      context: ./examples
      dockerfile: Dockerfile.test
    volumes:
      - .:/workspace:ro
    environment:
      PYTHONPATH: /workspace
    profiles:
      - test