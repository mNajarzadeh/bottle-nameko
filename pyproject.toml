[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bottle-nameko"
version = "0.1.0"
description = "Nameko RPC integration for Bottle applications"
requires-python = ">=3.10"
dependencies = ["bottle>=0.13,<0.14"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["bottle_nameko*"]